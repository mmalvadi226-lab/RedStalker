name: Build RedStalker

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedStalker
          path: target/RedStalker.jar
          if-no-files-found: error
